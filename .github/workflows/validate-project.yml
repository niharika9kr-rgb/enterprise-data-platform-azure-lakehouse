name: Validate Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      - name: Validate Python syntax
        run: |
          python -m compileall data_generator

      - name: Validate Databricks notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebook_files = sorted(Path("databricks").glob("*.ipynb"))

          if not notebook_files:
              raise SystemExit("No Databricks notebooks found.")

          for notebook_path in notebook_files:
              with notebook_path.open("r", encoding="utf-8") as file:
                  notebook = nbformat.read(file, as_version=4)

              if not notebook.cells:
                  raise ValueError(f"{notebook_path} contains no cells.")

              print(f"Validated: {notebook_path}")
          PY

      - name: Check required project files
        run: |
          test -f README.md
          test -f documentation/architecture.md
          test -f documentation/pipeline.md
          test -d images
          test -d databricks
          test -d data_generator

      - name: Check for committed DS Store files
        run: |
          if git ls-files | grep -q '\.DS_Store$'; then
            echo "Tracked .DS_Store files found."
            exit 1
          fi